name: Deploy Domyos Cycling Hub PWA to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Zero-Leak Sanitize & Install dependencies
        run: |
          rm -rf public/assets docs
          echo "{}" > firebase-applet-config.json
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.devDependencies) {
              delete pkg.devDependencies["@firebase/eslint-plugin-security-rules"];
              delete pkg.devDependencies["eslint"];
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build Production PWA Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
